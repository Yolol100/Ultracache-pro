name: Temporary activation schema-order patch

on:
  push:
    branches:
      - fix/audit-release-blockers-20260817
    paths:
      - '.github/workflows/tmp-activation-schema-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - name: Move schema creation before activation option migrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/core/installer/ucp-installer-lifecycle-trait.php')
          s = p.read_text(encoding='utf-8')
          old_start = """    protected static function activate_single_site_unlocked($token) {\n        $created_defaults = UCP_Options::maybe_init_defaults();\n        UCP_Options::maybe_apply_performance_migration();\n        UCP_Options::maybe_upgrade_exact_transaction_rules_v1();\n        self::assert_upgrade_lock($token, 'activation_options');\n"""
          new_start = """    protected static function activate_single_site_unlocked($token) {\n        if (!self::create_tables()) {\n            if (class_exists('UCP_Diagnostics')) {\n                UCP_Diagnostics::record('upgrade', 'UltraCache activation stopped because the database schema could not be verified.', array(\n                    'to' => UCP_VERSION,\n                ));\n            }\n            return false;\n        }\n        self::assert_upgrade_lock($token, 'activation_schema');\n\n        $created_defaults = UCP_Options::maybe_init_defaults();\n        UCP_Options::maybe_apply_performance_migration();\n        UCP_Options::maybe_upgrade_exact_transaction_rules_v1();\n        self::assert_upgrade_lock($token, 'activation_options');\n"""
          old_late = """        if (!self::create_tables()) {\n            if (class_exists('UCP_Diagnostics')) {\n                UCP_Diagnostics::record('upgrade', 'UltraCache activation stopped because the database schema could not be verified.', array(\n                    'to' => UCP_VERSION,\n                ));\n            }\n            return false;\n        }\n\n        self::assert_upgrade_lock($token, 'activation_schema');\n        self::schedule_events();\n"""
          assert s.count(old_start) == 1, s.count(old_start)
          assert s.count(old_late) == 1, s.count(old_late)
          s = s.replace(old_start, new_start, 1).replace(old_late, '        self::schedule_events();\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          php -l includes/core/installer/ucp-installer-lifecycle-trait.php
          python3 - <<'PY'
          from pathlib import Path
          s = Path('includes/core/installer/ucp-installer-lifecycle-trait.php').read_text(encoding='utf-8')
          fn = s.split('protected static function activate_single_site_unlocked($token) {', 1)[1].split('public static function deactivate(', 1)[0]
          schema = fn.index('self::create_tables()')
          defaults = fn.index('UCP_Options::maybe_init_defaults()')
          migration = fn.index('UCP_Options::maybe_apply_performance_migration()')
          assert schema < defaults < migration
          assert fn.count('self::create_tables()') == 1
          assert fn.count("self::assert_upgrade_lock($token, 'activation_schema')") == 1
          print('activation schema ordering: OK')
          PY
      - name: Commit validated activation fix
        shell: bash
        run: |
          git config user.name 'Webactueel Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/core/installer/ucp-installer-lifecycle-trait.php
          git diff --cached --exit-code && { echo 'No patch produced' >&2; exit 2; } || true
          git commit -m 'fix: create activation schema before option migrations'
          git push origin HEAD
